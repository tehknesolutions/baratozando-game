name: Import BARATOZANDO M1

on:
  push:
    branches:
      - feat/m1-first-threat
    paths:
      - '.m1import/payload.b64'

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message == 'chore: stage M1 payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify M1 payload
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .m1import/payload.b64 > /tmp/baratozando-m1-text.tar.xz
          echo "75fd3493f507e473cc5d2e2827aa217afa613e4cac04c589971899423e30708c  /tmp/baratozando-m1-text.tar.xz" | sha256sum -c -
          xz -t /tmp/baratozando-m1-text.tar.xz
          tar -tJf /tmp/baratozando-m1-text.tar.xz

      - name: Apply M1 files
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/baratozando-m1-text.tar.xz -C .
          rm -rf .m1import
          rm -f .github/workflows/m1-import.yml

      - name: Commit M1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement M1 First Threat"
          git push origin HEAD:feat/m1-first-threat
