name: Import BARATOZANDO M0 snapshot

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap2/chunk-16.txt'

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message == 'chore: stage bootstrap payload 17/17'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap2/chunk-*.txt > /tmp/baratozando-project.b64
          base64 --decode /tmp/baratozando-project.b64 > /tmp/baratozando-project.tar.xz
          echo "eb0a5e50ab6474e9dfa7d79b35bf088837c9027fbdde527dfd68e4768706aa48  /tmp/baratozando-project.tar.xz" | sha256sum -c -
          xz -t /tmp/baratozando-project.tar.xz
          tar -tJf /tmp/baratozando-project.tar.xz >/tmp/snapshot-files.txt
          echo "Snapshot entries: $(wc -l </tmp/snapshot-files.txt)"

      - name: Import snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/baratozando-project.tar.xz -C .
          rm -rf .bootstrap .bootstrap2
          rm -f .github/workflows/bootstrap-import.yml

      - name: Commit canonical M0 snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import BARATOZANDO M0 canonical snapshot"
          git push origin main
